{% extends "base.html" %}
{% block content %}
<div class="d-flex flex-column h-100 p-3 bg-light">
    <!-- HEADER -->
    <div class="row g-2 mb-3 align-items-center">
        <div class="col">
            <h5 class="fw-bold m-0 text-uppercase text-teal">Formula Records</h5>
            <small id="selectedRecordLabel" class="text-muted extra-small">Select a record to view details</small>
        </div>
        
        <div class="col-md-5">
            <div class="input-group input-group-sm shadow-sm">
                <input type="text" id="recordSearchInput" class="form-control uniform-input ps-3" placeholder="Search code, color, or lot...">
                <span class="input-group-text uniform-input bg-white"><i class="bi bi-search"></i></span>
            </div>
        </div>

        <div class="col-auto">
            <button class="btn btn-sm btn-outline-teal px-3" id="btnToggleSelection">
                <i class="bi bi-list-check"></i> Multi-Select
            </button>
            <button class="btn btn-sm btn-primary px-2" id="btnRefreshTable"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
    </div>

    <div class="row g-3 flex-grow-1 overflow-hidden">
        <!-- MAIN TABLE (Left - 9 columns) -->
        <div class="col-lg-9 h-100">
            <div class="rounded-3 border h-100 bg-white shadow-sm d-flex flex-column overflow-hidden">
                <div class="flex-grow-1 overflow-hidden">
                    <table class="table table-hover align-middle mb-0 w-100" id="formulaRecordsTable">
                        <thead class="bg-white sticky-top border-bottom">
                            <tr class="extra-small text-uppercase text-muted">
                                <th class="ps-3 selection-column d-none" style="width: 40px;">
                                    <input type="checkbox" id="selectAllRows" class="form-check-input">
                                </th>
                                <th class="no-wrap">Date</th>
                                <th>Product Code</th>
                                <th>Color Description</th>
                                <th>Mixing</th>
                                <th>Matched By</th>
                                <th>Lot No</th>
                                <th>Swatch</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody class="extra-small"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- BREAKDOWN (Right - 3 columns) -->
        <div class="col-lg-3 h-100">
            <div class="rounded-3 border h-100 bg-white shadow-sm d-flex flex-column overflow-hidden">
                <div class="p-2 border-bottom bg-light">
                    <h6 class="extra-small fw-bold text-uppercase text-teal m-0">Breakdown</h6>
                </div>
                <div class="flex-grow-1 overflow-auto">
                    <table class="table table-sm align-middle mb-0">
                        <thead class="bg-white sticky-top shadow-sm">
                            <tr class="extra-small">
                                <th class="ps-2">Material</th>
                                <th class="text-end pe-2">Weight</th>
                            </tr>
                        </thead>
                        <tbody id="materialDetailBody" class="extra-small">
                            <tr><td colspan="2" class="text-center py-5 text-muted italic">Click a row to view materials</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="mt-3 p-2 bg-white border rounded shadow-sm">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <select id="tableLength" class="form-select form-select-sm uniform-input" style="width: 120px;">
                    <option value="100">100 rows</option>
                    <option value="500">500 rows</option>
                    <option value="1000">1000 rows</option>
                </select>
                <small id="tableInfo" class="extra-small fw-bold text-muted"></small>
            </div>
            
            <div class="d-flex align-items-center gap-2">
                <!-- Date Filter -->
                <div class="d-flex align-items-center gap-1 bg-light p-1 rounded border me-2">
                    <input type="text" id="dateFrom" class="form-control form-control-sm date-picker-single border-0 bg-transparent" style="width: 85px; font-size: 0.7rem;" placeholder="From">
                    <span class="text-muted">-</span>
                    <input type="text" id="dateTo" class="form-control form-control-sm date-picker-single border-0 bg-transparent" style="width: 85px; font-size: 0.7rem;" placeholder="To">
                </div>
                <button class="btn btn-dark-teal btn-sm text-white px-3 shadow-sm" id="btnPriceFirst">Price First</button>
                <button class="btn btn-success btn-sm px-4 shadow-sm" id="btnExport">Export Excel</button>
            </div>
        </div>
    </div>
</div>

<style>
    .no-wrap { white-space: nowrap !important; width: 1%; padding-right: 20px !important; }
    .text-teal { color: #2c7a7b; }
    .btn-dark-teal { background-color: #234e52; }
    .table-active { background-color: #f0fff4 !important; border-left: 3px solid #38b2ac !important; }
    .color-swatch-rect { width: 45px; height: 18px; border-radius: 2px; border: 1px solid #dee2e6; display: inline-block; vertical-align: middle; }
    .uniform-input { font-size: 0.8rem; border-radius: 6px; }
</style>

<script>
$(document).ready(function() {
    // 1. Initialize DataTable
    const table = $('#formulaRecordsTable').DataTable({
        serverSide: true,
        processing: true,
        ajax: {
            url: "{% url 'formula_records_data' %}",
            data: function(d) {
                d.length = $('#tableLength').val();
            }
        },
        columns: [
            { 
                data: null, 
                className: "ps-3 selection-column d-none",
                orderable: false,
                render: function() { return '<input type="checkbox" class="form-check-input row-checkbox">'; }
            },
            { data: "date_display", className: "no-wrap fw-bold text-muted" },
            { data: "product_code", className: "fw-bold text-teal" },
            { data: "color" },
            { data: "mixing" },
            { data: "matched_by" },
            { data: "lot_no" },
            { 
                data: "html", 
                orderable: false,
                render: function(data) { return `<div class="color-swatch-rect" style="background-color: ${data}"></div>`; }
            },
            { 
                data: "type",
                render: function(data) {
                    const cls = data === 'MB' ? 'bg-primary' : 'bg-info';
                    return `<span class="badge ${cls} extra-small">${data}</span>`;
                }
            }
        ],
        dom: 'rtp',
        pageLength: 100,
        scrollY: '62vh',
        scrollCollapse: true,
        order: [[1, 'desc']],
        language: {
            processing: '<div class="spinner-border text-teal spinner-border-sm"></div>'
        },
        drawCallback: function() {
            const info = this.api().page.info();
            $('#tableInfo').text(`Showing ${info.recordsDisplay.toLocaleString()} of ${info.recordsTotal.toLocaleString()} formulas`);
        }
    });

    // 2. Search & Pagination Controls
    $('#recordSearchInput').on('keyup', function() { table.search(this.value).draw(); });
    $('#tableLength').on('change', function() { table.page.len(this.value).draw(); });
    $('#btnRefreshTable').on('click', () => table.ajax.reload());

    // 3. Selection Mode
    $('#btnToggleSelection').on('click', function() {
        const isHidden = $('.selection-column').hasClass('d-none');
        if(isHidden) {
            $('.selection-column').removeClass('d-none');
            $(this).addClass('bg-teal text-white').removeClass('btn-outline-teal');
        } else {
            $('.selection-column').addClass('d-none');
            $(this).removeClass('bg-teal text-white').addClass('btn-outline-teal');
            $('.row-checkbox, #selectAllRows').prop('checked', false);
        }
    });

    $('#selectAllRows').on('change', function() {
        $('.row-checkbox').prop('checked', $(this).is(':checked'));
    });

    // 4. Row Click -> Load Materials
    $('#formulaRecordsTable tbody').on('click', 'tr', async function(e) {
        if ($(e.target).is('input')) return; // Ignore if checkbox clicked
        
        $('tr').removeClass('table-active');
        $(this).addClass('table-active');
        
        const rowData = table.row(this).data();
        $('#selectedRecordLabel').html(`<span class="text-teal fw-bold">${rowData.type}-${rowData.id}</span> | ${rowData.product_code}`);
        
        $('#materialDetailBody').html('<tr><td colspan="2" class="text-center py-5"><div class="spinner-border spinner-border-sm text-teal"></div></td></tr>');

        try {
            const res = await fetch(`/cmf/formula-records/materials/${rowData.type}/${rowData.id}/`);
            const data = await res.json();
            
            if (data.materials.length === 0) {
                $('#materialDetailBody').html('<tr><td colspan="2" class="text-center py-5 text-muted">No materials found.</td></tr>');
                return;
            }

            const html = data.materials.map(m => `
                <tr>
                    <td class="ps-2 fw-bold text-muted" style="font-size: 0.7rem;">${m.material}</td>
                    <td class="pe-2 text-end fw-bold text-teal">${parseFloat(m.weight).toFixed(5)}</td>
                </tr>
            `).join('');
            $('#materialDetailBody').html(html);
        } catch (err) {
            $('#materialDetailBody').html('<tr><td colspan="2" class="text-center text-danger">Load failed</td></tr>');
        }
    });
});
</script>
{% endblock %}
