{% extends "base.html" %}
{% load static %}
{% block style %}
<link rel="stylesheet" href="{% static 'css/modal/master-formula/master_formula_lookup.css' %}">
<link rel="stylesheet" href="{% static 'css/modal/master-formula/master_formula_entry.css' %}">
{% endblock %}
{% block navigation %} 
Formulation
{% endblock navigation %}

{% block content %}
<div class="container-fluid p-0">
    <!-- Tab Navigation -->
    <ul class="nav nav-tabs master-formula-nav-tabs border-0" id="formulationTab" role="tablist">
        <li class="nav-item" role="presentation">
            <!-- Defaults to active if NO form_id is in the URL -->
            <button class="nav-link {% if not request.GET.form_id and not request.GET.new_entry %}active{% endif %}" id="fml-records-tab" data-bs-toggle="tab" data-bs-target="#fmlRecords" type="button" role="tab">
                <i class="bi bi-list-ul me-2"></i>Formulation Records
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <!-- Active only if specifically editing/viewing a form_id -->
            <button class="nav-link {% if request.GET.form_id or request.GET.new_entry %}active{% endif %}" id="fml-entry-tab" data-bs-toggle="tab" data-bs-target="#fmlEntry" type="button" role="tab">
                <i class="bi bi-plus-circle me-2"></i>Formulation Entry
            </button>
        </li>
    </ul>

    <!-- Unified Container Card -->
    <div class="card master-formula-container-card shadow-sm">
        <div class="card-body p-4">
            <div class="tab-content" id="formulationTabContent">
                <!-- Records Tab -->
                <div class="tab-pane fade {% if not request.GET.form_id and not request.GET.new_entry %}show active{% endif %}" id="fmlRecords" role="tabpanel">
                    {% include "sidemenu/formula/formulation_records.html" %}
                </div>
                <!-- Entry Tab -->
                <div class="tab-pane fade {% if request.GET.form_id or request.GET.new_entry %}show active{% endif %}" id="fmlEntry" role="tabpanel">
                    {% include "sidemenu/formula/formulation_entry.html" %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
