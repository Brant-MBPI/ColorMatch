<div class="master-formula-entry-form-container">
    <form id="masterFormulaEntryForm" method="POST">
        {% csrf_token %}
        <input type="hidden" name="form_id" value="{{ form_data.form_id|default:'' }}">
        
        <div class="row g-4">
            <!-- LEFT COLUMN: Formulation Details -->
            <div class="col-lg-6">
                <!-- Card 1: ID & Customer -->
                <div class="card mf-entry-card mb-3 shadow-sm">
                    <div class="card-body p-3">
                        <h6 class="mf-section-title mb-3">Customer &amp; Primary ID</h6>
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold text-muted">Formulation ID:</label></div>
                            <div class="col-md-8">
                                <input type="text" class="form-control form-control-sm uniform-input readonly-gray fw-bold" value="{{ form_data.form_id }}" readonly>
                            </div>
                        </div>
                        <div class="row g-2 align-items-center">
                            <div class="col-md-4"><label class="extra-small fw-bold required-label">Customer:</label></div>
                            <div class="col-md-8">
                                <select name="customer" id="id_mf_customer" class="form-select form-select-sm ts-select" placeholder="Select customer..." required>
                                    <option value=""></option>
                                    {% for customer in customers %}
                                        <option value="{{ customer }}" {% if form_data.customer == customer %}selected{% endif %}>{{ customer }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card 2: Technical Info -->
                <div class="card mf-entry-card mb-3 shadow-sm">
                    <div class="card-body p-3">
                        <h6 class="mf-section-title mb-3">Formulation Details</h6>
                        
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Index Ref. No.:</label></div>
                            <div class="col-md-8"><input type="text" name="index_no" id="id_mf_index_no" value="{{ form_data.index_no|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Product Code:</label></div>
                            <div class="col-md-8"><input type="text" name="product_code" id="id_mf_product_code" value="{{ form_data.product_code|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Product Color:</label></div>
                            <div class="col-md-8"><input type="text" name="prod_color" id="id_mf_prod_color" value="{{ form_data.prod_color|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Colorant Type:</label></div>
                            <div class="col-md-8">
                                <div class="d-flex gap-4">
                                    <div class="form-check m-0">
                                        <input class="form-check-input" type="radio" name="colorant_type" id="typeMB" value="MB" {% if form_data.colorant_type == 'MB' or not form_data.colorant_type %}checked{% endif %}>
                                        <label class="form-check-label extra-small fw-bold" for="typeMB">MB</label>
                                    </div>
                                    <div class="form-check m-0">
                                        <input class="form-check-input" type="radio" name="colorant_type" id="typeDC" value="DC" {% if form_data.colorant_type == 'DC' %}checked{% endif %}>
                                        <label class="form-check-label extra-small fw-bold" for="typeDC">DC</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Sum of Con:</label></div>
                            <div class="col-md-8"><input type="text" id="id_mf_sum_of_con" name="total_concentration" value="{{ form_data.total_concentration|default:'0.000000' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Dosage:</label></div>
                            <div class="col-md-8"><input type="text" name="dosage" id="id_mf_dosage" value="{{ form_data.dosage|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Mixing Time:</label></div>
                            <div class="col-md-8"><input type="text" name="mix_time" id="id_mf_mix_time" value="{{ form_data.mix_time|default:'5 MIN' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Resin Used:</label></div>
                            <div class="col-md-8"><input type="text" name="resin" id="id_mf_resin" value="{{ form_data.resin|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Process (Application):</label></div>
                            <div class="col-md-8"><input type="text" name="application" id="id_mf_application" value="{{ form_data.application|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Matching No.:</label></div>
                            <div class="col-md-8">
                                <div class="input-group input-group-sm">
                                    <input type="text" name="cm_no" id="id_mf_cm_no" value="{{ form_data.cm_no|default:'' }}" class="form-control form-control-sm uniform-input" placeholder="Enter CM#/RS#">
                                    <button type="button" id="mfBrowseFormulasBtn" class="btn btn-sm btn-dark-teal" disabled>
                                        <i class="bi bi-search text-white"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Date Matched:</label></div>
                            <div class="col-md-8">
                                <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                                    <input type="text" name="colormatch_date" id="id_mf_colormatch_date" value="{{ form_data.colormatch_date|default:'' }}" class="form-control uniform-input date-picker-single" placeholder="MM/DD/YYYY" data-input>
                                    <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                </div>
                            </div>
                        </div>

                        <div class="row g-2 align-items-start mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Notes:</label></div>
                            <div class="col-md-8"><textarea name="notes" id="id_mf_notes" rows="2" class="form-control form-control-sm uniform-input" style="resize:none;">{{ form_data.notes|default:'' }}</textarea></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">HTML Hex / CMYK:</label></div>
                            <div class="col-md-8 d-flex gap-1">
                                <input type="text" name="html_code_hex" id="id_mf_html" value="{{ form_data.html_code_hex|default:'' }}" class="form-control form-control-sm uniform-input hex-input" placeholder="#HEX" maxlength="7" style="width: 80px;">
                                <input type="number" step="0.01" name="cyan" id="id_mf_cyan" value="{{ form_data.cyan|default:'' }}" class="form-control form-control-sm uniform-input text-center" placeholder="C">
                                <input type="number" step="0.01" name="magenta" id="id_mf_magenta" value="{{ form_data.magenta|default:'' }}" class="form-control form-control-sm uniform-input text-center" placeholder="M">
                                <input type="number" step="0.01" name="yellow" id="id_mf_yellow" value="{{ form_data.yellow|default:'' }}" class="form-control form-control-sm uniform-input text-center" placeholder="Y">
                                <input type="number" step="0.01" name="black" id="id_mf_black" value="{{ form_data.black|default:'' }}" class="form-control form-control-sm uniform-input text-center" placeholder="K">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card 3: Metadata -->
                <div class="card mf-entry-card shadow-sm">
                    <div class="card-body p-3">
                        <div class="row g-2 align-items-center mb-1">
                            <div class="col-md-4"><label class="extra-small fw-bold text-muted">Updated By:</label></div>
                            <div class="col-md-8"><input type="text" value="{{ form_data.updated_by|default:'---' }}" class="form-control form-control-sm uniform-input readonly-gray" readonly></div>
                        </div>
                        <div class="row g-2 align-items-center">
                            <div class="col-md-4"><label class="extra-small fw-bold text-muted">Last Modified:</label></div>
                            <div class="col-md-8"><input type="text" value="{{ form_data.date_time|default:'---' }}" class="form-control form-control-sm uniform-input readonly-gray" readonly></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Materials -->
            <div class="col-lg-6">
                <div class="card mf-entry-card mb-3 shadow-sm">
                    <div class="card-body p-3">
                        <h6 class="mf-section-title mb-3">Add Material</h6>
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Matched by:</label></div>
                            <div class="col-md-8">
                                <select name="matched_by" id="id_mf_matched_by" class="form-select form-select-sm ts-select" placeholder="Select personnel...">
                                    <option value=""></option>
                                    {% for u_name in users %}
                                        <option value="{{ u_name }}" {% if form_data.matched_by == u_name %}selected{% endif %}>{{ u_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Material Code:</label></div>
                            <div class="col-md-8">
                                <select id="id_mf_material_code" class="form-select form-select-sm ts-select" placeholder="Select material...">
                                    <option value=""></option>
                                    {% for material in materials %}
                                        <option value="{{ material }}">{{ material }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 align-items-center mb-3">
                            <div class="col-md-4"><label class="extra-small fw-bold">Concentration:</label></div>
                            <div class="col-md-8"><input type="number" step="0.000001" id="id_mf_concentration" class="form-control form-control-sm uniform-input" value="0.000000"></div>
                        </div>
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Encoded by:</label></div>
                            <div class="col-md-8"><input type="text" name="encoded_by" value="{{ form_data.encoded_by|default:user.first_name|default:'' }}" class="form-control form-control-sm uniform-input readonly-gray" readonly></div>
                        </div>
                        <div class="d-flex gap-2 justify-content-end mt-3">
                            <button type="button" id="mfAddMaterialBtn" class="btn btn-sm btn-success px-3">Add</button>
                            <button type="button" id="mfRemoveMaterialBtn" class="btn btn-sm btn-danger px-3">Remove</button>
                            <button type="button" id="mfClearMaterialsBtn" class="btn btn-sm btn-secondary px-3">Clear</button>
                        </div>
                    </div>
                </div>
                <div class="card mf-entry-card shadow-sm">
                    <div class="card-body p-3 d-flex flex-column">
                        <h6 class="mf-section-title mb-2">Material Breakdown</h6>
                        <div class="mf-material-table-body flex-grow-1" style="max-height: 420px; overflow-y: auto;">
                            <table class="table table-sm align-middle mb-0" id="mfMaterialTable">
                                <thead class="bg-light sticky-top">
                                    <tr class="extra-small text-uppercase">
                                        <th>Material Code</th>
                                        <th class="text-end">Concentration</th>
                                    </tr>
                                </thead>
                                <tbody id="mfMaterialTableBody">
                                    {% for mat in form_data.materials %}
                                    <tr class="mf-material-row" data-material="{{ mat.material_code }}" data-concentration="{{ mat.concentration }}" style="cursor: pointer;">
                                        <td>{{ mat.material_code }}</td>
                                        <td class="text-end">{{ mat.concentration }}</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                            <span class="fw-bold small text-uppercase">Total Sum:</span>
                            <span id="mfTotalConcentration" class="fw-bold text-teal">0.000000</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="d-flex justify-content-end gap-2 mt-4 mb-2">
            <button type="button" class="btn btn-sm btn-primary px-4 shadow-sm btn-new">
                <i class="bi bi-file-earmark-plus me-1"></i> New
            </button>
            <button type="button" class="btn btn-sm btn-success px-4 shadow-sm btn-save">
                <i class="bi bi-save me-1"></i> {% if form_data.is_new %}Save{% else %}Update{% endif %}
            </button>
        </div>
    </form>
</div>

<!-- THE FLOATING MODAL OVERLAY -->
<div id="mfFormulaLookupModal" class="d-none" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2050; display: flex; align-items: center; justify-content: center;">
    <div class="modal-dialog modal-xl w-100" style="max-width: 1100px;">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header bg-dark text-white py-2">
                <h5 class="modal-title fs-6 fw-bold">
                    <i class="bi bi-file-earmark-medical me-2"></i>Formula lookup: <span id="mfLookupMatchingNo"></span>
                </h5>
                <button type="button" class="btn-close btn-close-white" id="id_close_modal_top"></button>
            </div>
            <div class="modal-body p-0 bg-white" id="mfLookupModalBody" style="max-height: 75vh; overflow-y: auto;"></div>
            <div class="modal-footer py-2 bg-light d-flex justify-content-end gap-2 pe-3">
                <button type="button" class="btn btn-primary btn-sm px-4" id="id_modal_select_btn" disabled>Select Formula</button>
                <button type="button" class="btn btn-secondary btn-sm px-3" id="id_close_modal_bottom">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        // --- 1. MATERIAL LOGIC ---
        const materialTableBody = document.getElementById('mfMaterialTableBody');
        const sumOfConInput = document.getElementById('id_mf_sum_of_con');
        const totalDisplay = document.getElementById('mfTotalConcentration');
        const materialCodeSelect = document.getElementById('id_mf_material_code');
        const concentrationInput = document.getElementById('id_mf_concentration');
        let selectedRow = null;

        function recalcTotal() {
            let total = 0;
            materialTableBody.querySelectorAll('tr.mf-material-row').forEach(row => {
                total += parseFloat(row.dataset.concentration) || 0;
            });
            const totalStr = total.toFixed(6);
            if (totalDisplay) totalDisplay.innerText = totalStr;
            if (sumOfConInput) sumOfConInput.value = totalStr;
        }

        function addMaterialRow(code, concentration) {
            const row = document.createElement('tr');
            row.className = 'mf-material-row';
            row.dataset.material = code; row.dataset.concentration = concentration;
            row.style.cursor = 'pointer';
            row.innerHTML = `<td>${code}</td><td class="text-end">${concentration}</td>`;
            row.addEventListener('click', () => {
                materialTableBody.querySelectorAll('tr').forEach(r => r.classList.remove('table-active'));
                row.classList.add('table-active');
                selectedRow = row;
            });
            materialTableBody.appendChild(row);
        }

        materialTableBody.querySelectorAll('tr.mf-material-row').forEach(row => {
            row.addEventListener('click', () => {
                materialTableBody.querySelectorAll('tr').forEach(r => r.classList.remove('table-active'));
                row.classList.add('table-active');
                selectedRow = row;
            });
        });

        document.getElementById('mfAddMaterialBtn').addEventListener('click', function () {
            const code = materialCodeSelect.value;
            const concentration = parseFloat(concentrationInput.value) || 0;
            if (!code) { Preline.toast('Please select a material code.', 'warning'); return; }
            const existing = Array.from(materialTableBody.querySelectorAll('tr.mf-material-row')).find(r => r.dataset.material === code);
            if (existing) {
                existing.dataset.concentration = concentration;
                existing.querySelector('td:last-child').innerText = concentration;
            } else { addMaterialRow(code, concentration); }
            recalcTotal();
        });

        document.getElementById('mfRemoveMaterialBtn').addEventListener('click', function () {
            if (!selectedRow) { Preline.toast('Select a material row to remove.', 'warning'); return; }
            selectedRow.remove(); selectedRow = null; recalcTotal();
        });

        document.getElementById('mfClearMaterialsBtn').addEventListener('click', function () {
            Preline.confirm('Clear All Materials?', 'This will remove every material row. Continue?', 'warning', () => {
                materialTableBody.innerHTML = ''; selectedRow = null; recalcTotal();
            });
        });

        recalcTotal();

        // --- 2. MODAL & LOOKUP LOGIC ---
        const cmNoInput = document.getElementById('id_mf_cm_no');
        const browseBtn = document.getElementById('mfBrowseFormulasBtn');
        const lookupModal = document.getElementById('mfFormulaLookupModal');
        const lookupModalBody = document.getElementById('mfLookupModalBody');
        const selectBtn = document.getElementById('id_modal_select_btn');
        let highlightedLookupRow = null;

        cmNoInput.addEventListener('input', () => { browseBtn.disabled = cmNoInput.value.trim() === ''; });

        const closeModal = () => { lookupModal.classList.add('d-none'); lookupModal.style.display = 'none'; };
        document.getElementById('id_close_modal_top').addEventListener('click', closeModal);
        document.getElementById('id_close_modal_bottom').addEventListener('click', closeModal);
        lookupModal.addEventListener('click', (e) => { if (e.target === lookupModal) closeModal(); });

        /**
         * UPDATED: Core logic to map row data to the entry form
         */
        function loadFormulaIntoForm(row) {
            const ds = row.dataset;

            // 1. Parent Details (From CMF/RS)
            // For TomSelect fields, we use .setValue()
            if (document.getElementById('id_mf_customer').tomselect) {
                document.getElementById('id_mf_customer').tomselect.setValue(ds.customer || '');
            }
            document.getElementById('id_mf_resin').value = ds.resin || '';
            document.getElementById('id_mf_application').value = ds.application || '';
            
            // 2. Colorant Type Radio
            const radioId = (ds.colorantType === 'DC') ? 'typeDC' : 'typeMB';
            const radio = document.getElementById(radioId);
            if (radio) radio.checked = true;

            // 3. Technical Formula Header Details
            document.getElementById('id_mf_product_code').value = ds.productCode || '';
            document.getElementById('id_mf_prod_color').value = ds.color || '';
            document.getElementById('id_mf_sum_of_con').value = ds.sumCon || '0.000000';
            document.getElementById('id_mf_dosage').value = ds.dosage || '';
            document.getElementById('id_mf_mix_time').value = ds.mixingTime || '5 MIN';
            document.getElementById('id_mf_colormatch_date').value = ds.dateMatched || '';
            
            // 4. CMYK / HEX
            document.getElementById('id_mf_html').value = ds.html || '';
            document.getElementById('id_mf_cyan').value = ds.cyan || '';
            document.getElementById('id_mf_magenta').value = ds.magenta || '';
            document.getElementById('id_mf_yellow').value = ds.yellow || '';
            document.getElementById('id_mf_black').value = ds.black || '';

            // 5. Matched By (TomSelect)
            if (document.getElementById('id_mf_matched_by').tomselect) {
                document.getElementById('id_mf_matched_by').tomselect.setValue(ds.matchedBy || '');
            }

            // 6. Materials (Ingredients)
            const scriptTag = document.getElementById(ds.scriptId);
            if (scriptTag) {
                const ingredients = JSON.parse(scriptTag.textContent);
                materialTableBody.innerHTML = '';
                ingredients.forEach(ing => addMaterialRow(ing.material, ing.value));
                recalcTotal();
            }

            closeModal();
            Preline.toast('Formula details loaded into form.', 'success');
        }

        selectBtn.addEventListener('click', () => { if (highlightedLookupRow) loadFormulaIntoForm(highlightedLookupRow); });

        browseBtn.addEventListener('click', async function () {
            const matchingNo = cmNoInput.value.trim();
            document.getElementById('mfLookupMatchingNo').innerText = matchingNo;
            lookupModalBody.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-teal"></div></div>';
            lookupModal.classList.remove('d-none'); lookupModal.style.display = 'flex';
            selectBtn.disabled = true;

            try {
                const response = await fetch(`/master-formula/lookup/?matching_no=${encodeURIComponent(matchingNo)}`);
                lookupModalBody.innerHTML = await response.text();

                lookupModalBody.querySelectorAll('.mf-lookup-header-row').forEach(row => {
                    row.addEventListener('click', function() {
                        lookupModalBody.querySelectorAll('.mf-lookup-header-row').forEach(r => r.classList.remove('table-active'));
                        row.classList.add('table-active');
                        highlightedLookupRow = row; selectBtn.disabled = false;

                        const nextRow = row.nextElementSibling;
                        if (nextRow && nextRow.classList.contains('ingredient-sub-row')) {
                            const isHidden = nextRow.classList.toggle('d-none');
                            const icon = row.querySelector('.toggle-main-icon');
                            if(icon) icon.className = isHidden ? 'bi bi-plus-circle-fill toggle-main-icon text-teal' : 'bi bi-dash-circle-fill toggle-main-icon text-danger';
                        }
                    });
                    row.addEventListener('dblclick', () => loadFormulaIntoForm(row));
                });
            } catch (err) { lookupModalBody.innerHTML = '<div class="text-center py-5 text-danger">Error fetching data.</div>'; }
        });
    })();
</script>
