<div class="master-formula-entry-form-container">
    <form id="masterFormulaEntryForm" method="POST">
        <input type="hidden" name="form_id" value="{{ form_data.form_id|default:'' }}">
        <div class="row g-4">
            <!-- LEFT COLUMN: Customer & Formulation Info -->
            <div class="col-lg-6">
                <div class="card mf-entry-card mb-3 shadow-sm">
                    <div class="card-body p-3">
                        <h6 class="mf-section-title mb-3">Customer &amp; Primary ID Info</h6>

                        <div class="row g-2 align-items-center mb-3">
                            <div class="col-md-4"><label class="extra-small fw-bold">Formulation ID:</label></div>
                            <div class="col-md-8">
                                <input type="text" class="form-control form-control-sm uniform-input readonly-gray fw-bold" value="{{ form_data.form_id|default:'New' }}" readonly>
                            </div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Customer:</label></div>
                            <div class="col-md-8">
                                <select name="customer" id="id_mf_customer" class="form-select form-select-sm ts-select" placeholder="Select customer..." required>
                                    <option value=""></option>
                                    {% for customer in customers %}
                                        <option value="{{ customer }}" {% if form_data.customer == customer %}selected{% endif %}>{{ customer }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mf-entry-card shadow-sm">
                    <div class="card-body p-3">
                        <h6 class="mf-section-title mb-3">Formulation Info</h6>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Index Ref. No.:</label></div>
                            <div class="col-md-8"><input type="text" name="index_no" value="{{ form_data.index_no|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Product Code:</label></div>
                            <div class="col-md-8"><input type="text" name="product_code" value="{{ form_data.product_code|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Product Color:</label></div>
                            <div class="col-md-8"><input type="text" name="prod_color" value="{{ form_data.prod_color|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Sum of Con:</label></div>
                            <div class="col-md-8"><input type="text" id="id_mf_sum_of_con" name="total_concentration" value="{{ form_data.total_concentration|default:'0.000000' }}" class="form-control form-control-sm uniform-input readonly-gray" readonly></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Dosage:</label></div>
                            <div class="col-md-8"><input type="text" name="dosage" value="{{ form_data.dosage|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Mixing Time:</label></div>
                            <div class="col-md-8"><input type="text" name="mix_time" value="{{ form_data.mix_time|default:'5 MIN' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Resin Used:</label></div>
                            <div class="col-md-8"><input type="text" name="resin" value="{{ form_data.resin|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Application:</label></div>
                            <div class="col-md-8"><input type="text" name="application" value="{{ form_data.application|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Matching No.:</label></div>
                            <div class="col-md-8"><input type="text" name="cm_no" value="{{ form_data.cm_no|default:'' }}" class="form-control form-control-sm uniform-input"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Date Matched:</label></div>
                            <div class="col-md-8">
                                <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                                    <input type="text" name="colormatch_date" value="{{ form_data.colormatch_date|default:'' }}" class="form-control uniform-input date-picker-single" placeholder="MM/DD/YYYY" data-input>
                                    <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                </div>
                            </div>
                        </div>

                        <div class="row g-2 align-items-start mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Notes:</label></div>
                            <div class="col-md-8"><textarea name="notes" rows="3" class="form-control form-control-sm uniform-input">{{ form_data.notes|default:'' }}</textarea></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">HTML:</label></div>
                            <div class="col-md-8"><input type="text" name="html_code_hex" value="{{ form_data.html_code_hex|default:'' }}" class="form-control form-control-sm uniform-input hex-input" placeholder="#FFFFFF" maxlength="7"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">C / M / Y / K:</label></div>
                            <div class="col-md-8 d-flex gap-1">
                                <input type="number" step="0.01" name="cyan" value="{{ form_data.cyan|default:'' }}" class="form-control form-control-sm uniform-input text-center" placeholder="C">
                                <input type="number" step="0.01" name="magenta" value="{{ form_data.magenta|default:'' }}" class="form-control form-control-sm uniform-input text-center" placeholder="M">
                                <input type="number" step="0.01" name="yellow" value="{{ form_data.yellow|default:'' }}" class="form-control form-control-sm uniform-input text-center" placeholder="Y">
                                <input type="number" step="0.01" name="black" value="{{ form_data.black|default:'' }}" class="form-control form-control-sm uniform-input text-center" placeholder="K">
                            </div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Updated By:</label></div>
                            <div class="col-md-8"><input type="text" value="{{ form_data.updated_by|default:'' }}" class="form-control form-control-sm uniform-input readonly-gray" readonly></div>
                        </div>

                        <div class="row g-2 align-items-center">
                            <div class="col-md-4"><label class="extra-small fw-bold">Date and Time:</label></div>
                            <div class="col-md-8"><input type="text" value="{{ form_data.date_time|default:'' }}" class="form-control form-control-sm uniform-input readonly-gray" readonly></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Personnel + Material Entry + Material Table -->
            <div class="col-lg-6">
                <div class="card mf-entry-card mb-3 shadow-sm">
                    <div class="card-body p-3">
                        <h6 class="mf-section-title mb-3">Add Material</h6>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Matched by:</label></div>
                            <div class="col-md-8">
                                <select name="matched_by" id="id_mf_matched_by" class="form-select form-select-sm ts-select" placeholder="Select personnel...">
                                    <option value=""></option>
                                    {% for u_name in users %}
                                        <option value="{{ u_name }}" {% if form_data.matched_by == u_name %}selected{% endif %}>{{ u_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Material Code:</label></div>
                            <div class="col-md-8">
                                <select id="id_mf_material_code" class="form-select form-select-sm ts-select" placeholder="Select material...">
                                    <option value=""></option>
                                    {% for material in materials %}
                                        <option value="{{ material }}">{{ material }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row g-2 align-items-center mb-3">
                            <div class="col-md-4"><label class="extra-small fw-bold">Concentration:</label></div>
                            <div class="col-md-8"><input type="number" step="0.01" id="id_mf_concentration" class="form-control form-control-sm uniform-input" value="0.000000"></div>
                        </div>

                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-md-4"><label class="extra-small fw-bold">Encoded by:</label></div>
                            <div class="col-md-8"><input type="text" name="encoded_by" value="{{ form_data.encoded_by|default:user.first_name|default:'' }}" class="form-control form-control-sm uniform-input readonly-gray" readonly></div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end mt-3">
                            <button type="button" id="mfAddMaterialBtn" class="btn btn-sm btn-success px-3">Add</button>
                            <button type="button" id="mfRemoveMaterialBtn" class="btn btn-sm btn-danger px-3">Remove</button>
                            <button type="button" id="mfClearMaterialsBtn" class="btn btn-sm btn-secondary px-3">Clear</button>
                        </div>
                    </div>
                </div>

                <div class="card mf-entry-card shadow-sm">
                    <div class="card-body p-3 d-flex flex-column">
                        <h6 class="mf-section-title mb-2">Material Code &amp; Concentration</h6>

                        <div class="mf-material-table-body flex-grow-1" style="max-height: 320px; overflow-y: auto;">
                            <table class="table table-sm align-middle mb-0" id="mfMaterialTable">
                                <thead class="bg-light sticky-top">
                                    <tr class="extra-small text-uppercase">
                                        <th>Material Code</th>
                                        <th class="text-end">Concentration</th>
                                    </tr>
                                </thead>
                                <tbody id="mfMaterialTableBody">
                                    {% for mat in form_data.materials %}
                                    <tr class="mf-material-row" data-material="{{ mat.material_code }}" data-concentration="{{ mat.concentration }}" style="cursor: pointer;">
                                        <td>{{ mat.material_code }}</td>
                                        <td class="text-end">{{ mat.concentration }}</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                            <span class="fw-bold small text-uppercase">Total Sum of Concentration:</span>
                            <span id="mfTotalConcentration" class="fw-bold text-teal">0.000000</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="d-flex justify-content-end gap-2 mt-4 mb-2">
            <button type="button" class="btn btn-sm btn-dark-teal px-3 text-white shadow-sm btn-print">
                <i class="bi bi-printer"></i> Preview
            </button>
            <button type="button" class="btn btn-sm btn-primary px-3 shadow-sm btn-new">
                <i class="bi bi-plus-lg"></i> New
            </button>
            <button type="button" class="btn btn-sm btn-success px-3 shadow-sm btn-save">
                <i class="bi bi-save"></i> {% if form_data.form_id %}Update{% else %}Save{% endif %}
            </button>
        </div>
    </form>
</div>

<script>
    (function () {
        const materialCodeSelect = document.getElementById('id_mf_material_code');
        const concentrationInput = document.getElementById('id_mf_concentration');
        const materialTableBody = document.getElementById('mfMaterialTableBody');
        const totalDisplay = document.getElementById('mfTotalConcentration');
        const sumOfConInput = document.getElementById('id_mf_sum_of_con');

        let selectedRow = null;

        function recalcTotal() {
            let total = 0;
            materialTableBody.querySelectorAll('tr.mf-material-row').forEach(row => {
                total += parseFloat(row.dataset.concentration) || 0;
            });
            const totalStr = total.toFixed(6);
            totalDisplay.innerText = totalStr;
            if (sumOfConInput) sumOfConInput.value = totalStr;
        }

        function addMaterialRow(code, concentration) {
            const row = document.createElement('tr');
            row.className = 'mf-material-row';
            row.dataset.material = code;
            row.dataset.concentration = concentration;
            row.style.cursor = 'pointer';
            row.innerHTML = `<td>${code}</td><td class="text-end">${concentration}</td>`;
            row.addEventListener('click', () => selectRow(row));
            materialTableBody.appendChild(row);
        }

        function selectRow(row) {
            materialTableBody.querySelectorAll('tr').forEach(r => r.classList.remove('table-active'));
            row.classList.add('table-active');
            selectedRow = row;
        }

        // Wire up click on any pre-rendered rows (from form_data.materials on edit)
        materialTableBody.querySelectorAll('tr.mf-material-row').forEach(row => {
            row.addEventListener('click', () => selectRow(row));
        });

        document.getElementById('mfAddMaterialBtn').addEventListener('click', function () {
            const code = materialCodeSelect.value;
            const concentration = parseFloat(concentrationInput.value) || 0;

            if (!code) {
                Preline.toast('Please select a material code.', 'warning');
                return;
            }

            // If the same material already exists, update it instead of duplicating
            const existing = Array.from(materialTableBody.querySelectorAll('tr.mf-material-row'))
                .find(r => r.dataset.material === code);

            if (existing) {
                existing.dataset.concentration = concentration;
                existing.querySelector('td:last-child').innerText = concentration;
            } else {
                addMaterialRow(code, concentration);
            }

            recalcTotal();
        });

        document.getElementById('mfRemoveMaterialBtn').addEventListener('click', function () {
            if (!selectedRow) {
                Preline.toast('Select a material row to remove.', 'warning');
                return;
            }
            selectedRow.remove();
            selectedRow = null;
            recalcTotal();
        });

        document.getElementById('mfClearMaterialsBtn').addEventListener('click', function () {
            Preline.confirm(
                'Clear All Materials?',
                'This will remove every material row from this formulation. Continue?',
                'warning',
                () => {
                    materialTableBody.innerHTML = '';
                    selectedRow = null;
                    recalcTotal();
                }
            );
        });

        recalcTotal();
    })();
</script>
