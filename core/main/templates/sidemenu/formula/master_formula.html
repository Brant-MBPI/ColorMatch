{% extends "base.html" %}
{% load static %}
{% block style %}
<link rel="stylesheet" href="{% static 'css/modal/master-formula/master_formula_lookup.css' %}">
{% endblock %}
{% block navigation %} 
Master Formula
{% endblock navigation %}

{% block content %}
<div class="container-fluid p-0">
    <!-- Tab Navigation -->
    <ul class="nav nav-tabs master-formula-nav-tabs border-0" id="masterFormulaTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link {% if not form_data %}active{% endif %}" id="mf-records-tab" data-bs-toggle="tab" data-bs-target="#mfRecords" type="button" role="tab">
                <i class="bi bi-list-ul me-2"></i>Formulation Records
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link {% if form_data %}active{% endif %}" id="mf-entry-tab" data-bs-toggle="tab" data-bs-target="#mfEntry" type="button" role="tab">
                <i class="bi bi-plus-circle me-2"></i>Formulation Entry
            </button>
        </li>
    </ul>

    <!-- Unified Container Card -->
    <div class="card master-formula-container-card shadow-sm">
        <div class="card-body p-4">
            <div class="tab-content" id="masterFormulaTabContent">
                <!-- Records Tab -->
                <div class="tab-pane fade {% if not form_data %}show active{% endif %}" id="mfRecords" role="tabpanel">
                    {% include "sidemenu/formula/master_formula_records.html" %}
                </div>
                <!-- Entry Tab -->
                <div class="tab-pane fade {% if form_data %}show active{% endif %}" id="mfEntry" role="tabpanel">
                    {% include "sidemenu/formula/master_formula_entry.html" %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
